name: Build framed floral animation V7.2 (temporary)
on:
  push:
    branches: [fix/v72-floral-and-motion-no-flicker]
    paths: ['.github/workflows/build-floral-v72.yml']
permissions:
  contents: write
jobs:
  build-floral:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v72-floral-and-motion-no-flicker
          persist-credentials: true
      - name: Produce smooth mask for source-supplied portrait film
        run: |
          python3 - <<'PY'
          w,h=864,1536
          with open('/tmp/to-v72-mask.pgm','wb') as f:
              f.write(f'P5\n{w} {h}\n255\n'.encode())
              for y in range(h):
                  row=bytearray(w)
                  for x in range(w):
                      a=min(1.,x/70.,(w-1-x)/138.,y/65.,(h-1-y)/85.)
                      row[x]=max(0,min(255,round(255*a*a*(3-2*a))))
                  f.write(row)
          PY
      - name: Reframe original 6-second poppy animation without altering source
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          command -v ffmpeg
          test -s site/assets/media/animacao-papoulas.mp4
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'color=c=0xf4f4f2:s=1080x1920:r=24' \
            -i site/assets/media/animacao-papoulas.mp4 \
            -loop 1 -i /tmp/to-v72-mask.pgm \
            -filter_complex '[1:v]fps=24,scale=864:1536:flags=lanczos,format=rgb24[fg];[2:v]format=gray[mask];[fg][mask]alphamerge[fade];[0:v][fade]overlay=x=(W-w)/2:y=(H-h)/2:format=auto:shortest=1[v]' \
            -map '[v]' -t 6 -an -c:v libx264 -preset fast -crf 23 -pix_fmt yuv420p \
            -movflags +faststart site/assets/media/animacao-papoulas-editorial-v72.mp4
          test "$(stat -c%s site/assets/media/animacao-papoulas-editorial-v72.mp4)" -gt 100000
          ffprobe -v error -show_entries stream=width,height,duration -of default=noprint_wrappers=1 site/assets/media/animacao-papoulas-editorial-v72.mp4
      - name: Commit derived media only to review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/assets/media/animacao-papoulas-editorial-v72.mp4
          git commit -m 'assets(v7.2): reframe original floral video with feathered edges' || exit 0
          git fetch origin fix/v72-floral-and-motion-no-flicker
          git rebase origin/fix/v72-floral-and-motion-no-flicker
          git push origin HEAD:fix/v72-floral-and-motion-no-flicker
