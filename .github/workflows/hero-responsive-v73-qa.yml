name: QA HERO responsivo sem espelhamento V7.3
on:
  push:
    branches: ['fix/hero-responsive-single-video-v73']
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  hero-qa:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Playwright (Chromium já instalado)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chrome
      - name: Testes estruturais e sintaxe
        run: |
          node tests/hero-responsive-v73-smoke.mjs
          node --check site/hero-v5.js
          node --check site/main.js
          node --check site/v7.js
          test -z "$(grep -E 'hero-bleed.js|hero-edge-canvas' site/index.html || true)"
      - name: QA em sete resoluções com HTTP Range para scrub
        run: |
          node tests/v7-range-server.mjs >/tmp/hero-range-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ -o /dev/null && break || sleep 1; done
          curl -sSI -H 'Range: bytes=0-63' http://127.0.0.1:8765/assets/media/motion-hero.mp4 | grep -q '206 Partial Content'
          node tests/hero-responsive-v73-visual.mjs
      - name: Registrar previews visuais como blobs temporários (sem alterar branch)
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tests/upload-hero-v73-review.mjs
      - name: Capturas do HERO e JSON de resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: to-hero-single-video-v73-qa
          path: qa-hero-v73/
          if-no-files-found: warn
