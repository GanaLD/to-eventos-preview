name: QA HeroScroll mobile real 9x16
on:
  push:
    branches: [fix/mobile-real-heroscroll-portrait-v10]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  mobile-hero:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Instalar navegador Chrome com H264
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chrome
      - name: Teste estrutural mobile
        run: |
          node --check site/hero-v5.js
          node tests/hero-mobile-v10-smoke.mjs
      - name: Teste real com vídeo e touch
        run: |
          node tests/v7-range-server.mjs >/tmp/mobile-range-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ -o /dev/null && break || sleep 1; done
          node tests/hero-mobile-v10-visual.mjs
      - name: Screenshots para revisão
        if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tests/hero-mobile-v10-export-review.mjs
      - name: Evidências completas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-mobile-real-v10
          path: qa-mobile-hero-v10/
          if-no-files-found: warn
