name: Publicar preview da TO Eventos
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Validar regressões da V4
        run: |
          node tests/v4-smoke.mjs
          node tests/v41-smoke.mjs
          node tests/staggered-menu-smoke.mjs
          node tests/hero-v5-smoke.mjs
          node tests/florais-v6-check.mjs
          node tests/v7-smoke.mjs
          node tests/v71-smoke.mjs
          node tests/v72-no-flicker.mjs
          node tests/v74-smoke.mjs
          node --check site/motion-v74.js
          test -s site/assets/media/papoulas-seamless-v74.mp4
          node tests/accordion-gallery-v1-smoke.mjs
          node --check site/accordion-gallery.js
          node --check site/v7.js
          node --check site/florais-v6.js
          node --check site/main.js
          node --check site/staggered-menu.js
          node --check site/ui-v4.js
          node --check site/ui-v41.js
          node --check site/hero-v5.js
      - name: Integrar vídeo autoral do HERO no artefato do Pages
        run: |
          mkdir -p site/assets/media
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 90 'https://d2ol7oe51mr4n9.cloudfront.net/user_2wayxIrYymbrFzIPfYY8jkYgTU2/0541ee43-65c7-4f9e-b054-2796ac3aeaab.mp4' --output /tmp/to-eventos-motion-hero-original.mp4
          test "$(wc -c < /tmp/to-eventos-motion-hero-original.mp4)" -gt 100000
          # Source MP4 has one keyframe; GOP de 12 (0,5 s a 24 fps) torna seeking por scroll viável.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg || true
          fi
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -hide_banner -loglevel error -i /tmp/to-eventos-motion-hero-original.mp4 -c:v libx264 -preset fast -crf 23 -g 12 -keyint_min 12 -sc_threshold 0 -pix_fmt yuv420p -an -movflags +faststart -y site/assets/media/motion-hero.mp4
          else
            echo "::warning::FFmpeg indisponível; publicando MP4 original sem transcodificação"
            cp /tmp/to-eventos-motion-hero-original.mp4 site/assets/media/motion-hero.mp4
          fi
          test "$(wc -c < site/assets/media/motion-hero.mp4)" -gt 100000
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
