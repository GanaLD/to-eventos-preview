name: Importar moldura vertical V14 para mobile
on:
  push:
    branches: [feature/floral-mobile-portrait-v14]
    paths:
      - .github/workflows/import-floral-mobile-v14.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-mobile-floral:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Baixar somente a mídia mobile retrato
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 'https://21173d58-3df2-4090-937c-e0b24f748915.sandbox.floot.app/_cdn/static/4a88bdf1-304c-4f27-b11d-dc4c8b72b09d-floral-mobile-v14.mp4' -o site/assets/media/floral-mobile-v14.mp4
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 'https://21173d58-3df2-4090-937c-e0b24f748915.sandbox.floot.app/_cdn/static/85b2b964-89e2-45e5-9188-d27fb1024ad0-floral-mobile-v14.webp' -o site/assets/media/floral-mobile-v14.webp
          echo '51a4806cd5d13e04d6145785716c1fbffc1bcb16a461f424f14aa457e1480e22  site/assets/media/floral-mobile-v14.mp4' | sha256sum --check
          echo '8103da3d92e0fd0da735563c47a2c93750db97c18cccbf6edddb91a38820d78c  site/assets/media/floral-mobile-v14.webp' | sha256sum --check
          node --check site/moldura-overlay.js
          node tests/moldura-mobile-v14-smoke.mjs
      - name: Gravar apenas arquivos novos de mídia
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/assets/media/floral-mobile-v14.mp4 site/assets/media/floral-mobile-v14.webp
          if ! git diff --cached --quiet; then
            git commit -m 'assets: importar overlay vertical de papoulas mobile'
            git push origin HEAD:feature/floral-mobile-portrait-v14
          fi
