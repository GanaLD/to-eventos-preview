name: Gerar alternativas WebM V7
on:
  push:
    paths: ['.github/workflows/webm-v7.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  webm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Preparar FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Gerar versões WebM sem alterar originais
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/assets/media
          curl -fsSL --retry 3 --max-time 120 'https://d2ol7oe51mr4n9.cloudfront.net/user_2wayxIrYymbrFzIPfYY8jkYgTU2/0541ee43-65c7-4f9e-b054-2796ac3aeaab.mp4' -o /tmp/to-original-motion.mp4
          ffmpeg -hide_banner -loglevel error -y -i /tmp/to-original-motion.mp4 -c:v libvpx-vp9 -deadline realtime -cpu-used 5 -b:v 0 -crf 30 -row-mt 1 -pix_fmt yuv420p -an site/assets/media/motion-hero.webm
          ffmpeg -hide_banner -loglevel error -y -i site/assets/media/animacao-papoulas.mp4 -c:v libvpx-vp9 -deadline realtime -cpu-used 5 -b:v 0 -crf 31 -row-mt 1 -pix_fmt yuv420p -an site/assets/media/animacao-papoulas.webm
          ffmpeg -hide_banner -loglevel error -y -i site/assets/media/connect-web.mp4 -c:v libvpx-vp9 -deadline realtime -cpu-used 6 -b:v 0 -crf 35 -row-mt 1 -tile-columns 2 -pix_fmt yuv420p -c:a libopus -b:a 96k site/assets/media/connect-web.webm
          for p in site/assets/media/motion-hero.webm site/assets/media/animacao-papoulas.webm site/assets/media/connect-web.webm; do
            test "$(wc -c < "$p")" -gt 30000
            ffprobe -v error -show_entries stream=codec_name -of csv=p=0 "$p"
          done
      - name: Integrar fontes compatíveis
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/assets/media/motion-hero.webm site/assets/media/animacao-papoulas.webm site/assets/media/connect-web.webm
          if ! git diff --cached --quiet; then
            git commit -m "assets(v7): WebM VP9 para Hero, papoulas e Connect"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
