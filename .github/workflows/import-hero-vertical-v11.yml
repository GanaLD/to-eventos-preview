name: Importar Hero vertical V11 somente mobile
on:
  push:
    branches: [feature/mobile-hero-vertical-v11-only]
    paths: [.github/workflows/import-hero-vertical-v11.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e verificar MP4 vertical de scroll
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 'https://21173d58-3df2-4090-937c-e0b24f748915.sandbox.floot.app/_cdn/static/110de586-4daf-4d99-8324-c37b50e5299b-hero-mobile-vertical-v11.mp4' -o site/assets/media/motion-hero-vertical-v11.mp4
          echo '9671cc26bde43229f42d7f423ebfc229500cbabd8566ea9fc21c9ad2f9f7976d  site/assets/media/motion-hero-vertical-v11.mp4' | sha256sum --check
          test "$(wc -c < site/assets/media/motion-hero-vertical-v11.mp4)" -gt 1000000
          ffprobe -v error -show_entries stream=width,height -of csv=p=0 site/assets/media/motion-hero-vertical-v11.mp4 2>/dev/null | grep -q '1080,1920' || python3 - <<'PY'
          from pathlib import Path
          assert b'ftyp' in Path('site/assets/media/motion-hero-vertical-v11.mp4').read_bytes()[:64]
          PY
          node tests/hero-mobile-v10-smoke.mjs
      - name: Commitar somente o vídeo mobile
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/assets/media/motion-hero-vertical-v11.mp4
          if ! git diff --cached --quiet; then
            git commit -m 'assets(mobile): incluir vídeo vertical aprovado do Hero'
            git push origin HEAD:feature/mobile-hero-vertical-v11-only
          fi
