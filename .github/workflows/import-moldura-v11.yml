name: Importar midia floral transparente V11 (branch de homologacao)
on:
  push:
    branches: [feature/moldura-papoulas-v11]
    paths:
      - .github/workflows/import-moldura-v11.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter projeto
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Baixar e validar somente novas midias
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 'https://21173d58-3df2-4090-937c-e0b24f748915.sandbox.floot.app/_cdn/static/a2b0109a-e46d-44f7-b91e-0f81b01458aa-TO-Eventos-V10-Patch-ISOLADO.zip' -o /tmp/moldura-v11.zip
          echo '6ebc8e10a390cb54aadabc0988ebd4a95f64211c87bc051486dd34f633dddcfc  /tmp/moldura-v11.zip' | sha256sum --check
          mkdir -p site/assets/media
          unzip -p /tmp/moldura-v11.zip 'TO-Eventos-V10/assets/media/moldura-alpha.webm' > site/assets/media/moldura-alpha.webm
          unzip -p /tmp/moldura-v11.zip 'TO-Eventos-V10/assets/media/moldura-final.webp' > site/assets/media/moldura-final.webp
          test "$(wc -c < site/assets/media/moldura-alpha.webm)" -gt 7000000
          test "$(wc -c < site/assets/media/moldura-final.webp)" -gt 300000
      - name: Registrar novas midias sem alterar outras
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/assets/media/moldura-alpha.webm site/assets/media/moldura-final.webp
          if ! git diff --cached --quiet; then
            git commit -m 'assets: adicionar papoulas alpha e poster (sem alterar video hero)'
            git push origin HEAD:feature/moldura-papoulas-v11
          fi
