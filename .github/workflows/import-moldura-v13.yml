name: Importar Composição 1 para moldura V13
on:
  push:
    branches: [feature/floral-screen-v13-sem-halo]
    paths: [.github/workflows/import-moldura-v13.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar e validar mídia V13
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 'https://21173d58-3df2-4090-937c-e0b24f748915.sandbox.floot.app/_cdn/static/186c539e-a79a-44a8-87ca-1ae3e6225727-moldura-v13-screen.mp4' -o site/assets/media/moldura-v13-screen.mp4
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 'https://21173d58-3df2-4090-937c-e0b24f748915.sandbox.floot.app/_cdn/static/81361b68-684a-4f9d-83f2-8809d688a898-moldura-v13-screen.webp' -o site/assets/media/moldura-v13-screen.webp
          echo '69f5ff783af4f16a4b63dcc2d241c16f17fb958289d566c8d101d7923316ef6b  site/assets/media/moldura-v13-screen.mp4' | sha256sum -c -
          echo 'ad1497e67862ab9f4dfdc29cddc13a6f768844134044eae20b6322a7f9ba8350  site/assets/media/moldura-v13-screen.webp' | sha256sum -c -
          node --check site/moldura-overlay.js
          node tests/moldura-v13-smoke.mjs
      - name: Gravar só mídia floral
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/assets/media/moldura-v13-screen.mp4 site/assets/media/moldura-v13-screen.webp
          if ! git diff --cached --quiet; then
            git commit -m 'assets: adicionar Composition 1 sem keying com halo'
            git push origin HEAD:feature/floral-screen-v13-sem-halo
          fi
