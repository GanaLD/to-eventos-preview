name: QA touch real HERO + projetos mobile V9
on:
  push:
    branches: [fix/mobile-touch-hero-projects-20261024]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  mobile-touch:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Chromium com MP4 H264
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chrome
      - name: Testes estruturais e sintaxe
        run: |
          node --check site/hero-v5.js
          node --check site/main.js
          node --check site/motion-v71.js
          node tests/mobile-scroll-v9-smoke.mjs
      - name: Chrome com toque real e HTTP Range
        run: |
          node tests/v7-range-server.mjs >/tmp/range-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ -o /dev/null && break || sleep 1; done
          curl -sSI -H 'Range: bytes=0-63' http://127.0.0.1:8765/assets/media/motion-hero.mp4 | grep -q '206 Partial Content'
          node tests/mobile-scroll-v9-touch.mjs
      - name: Evidências com capturas por viewport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: to-mobile-v9-touch-qa
          path: qa-mobile-scroll-v9/
          if-no-files-found: warn
