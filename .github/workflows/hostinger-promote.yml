name: Promote approved site to Hostinger

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publicar preview da TO Eventos"]
    branches: [main]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Integrar vídeo autoral do HERO no artefato de produção
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/assets/media
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 90 'https://d2ol7oe51mr4n9.cloudfront.net/user_2wayxIrYymbrFzIPfYY8jkYgTU2/0541ee43-65c7-4f9e-b054-2796ac3aeaab.mp4' --output /tmp/to-eventos-motion-hero-original.mp4
          test "$(wc -c < /tmp/to-eventos-motion-hero-original.mp4)" -gt 100000
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg || true
          fi
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -hide_banner -loglevel error -i /tmp/to-eventos-motion-hero-original.mp4 -c:v libx264 -preset fast -crf 23 -g 12 -keyint_min 12 -sc_threshold 0 -pix_fmt yuv420p -an -movflags +faststart -y site/assets/media/motion-hero.mp4
          else
            echo "::warning::FFmpeg indisponível; publicando MP4 original sem transcodificação"
            cp /tmp/to-eventos-motion-hero-original.mp4 site/assets/media/motion-hero.mp4
          fi
          test "$(wc -c < site/assets/media/motion-hero.mp4)" -gt 100000
      - name: Copy the approved site into the production branch
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          generated_assets="$RUNNER_TEMP/hostinger-generated-assets"
          mkdir -p "$generated_assets"
          cp site/assets/media/motion-hero.mp4 "$generated_assets/"
          # These generated files live inside site/ on the main checkout. Remove them after
          # copying to the runner temp folder so checkout can replace the site/ tree cleanly.
          rm -f site/assets/media/motion-hero.mp4
          git fetch origin hostinger-production
          git checkout -B hostinger-production origin/hostinger-production
          git rm -r --quiet -- .
          git archive "${source_sha}:site" | tar -x
          mkdir -p assets/media
          cp "$generated_assets/motion-hero.mp4" assets/media/
          python3 - <<'PY'
          from pathlib import Path
          for path in (Path("index.html"), Path("sobre/index.html")):
              content = path.read_text(encoding="utf-8")
              preview_tag = '<meta name="robots" content="noindex,nofollow">'
              if content.count(preview_tag) != 1:
                  raise SystemExit(f"Expected one preview robots tag in {path}")
              content = content.replace(preview_tag, '<meta name="robots" content="index,follow">')
              content = content.replace(
                  '<!-- A homologação no GitHub Pages não deve competir com a publicação definitiva em toeventos.com. Remover noindex somente ao publicar na Hostinger após aprovação. -->',
                  '<!-- Versão de produção publicada a partir da branch hostinger-production. -->',
              )
              path.write_text(content, encoding="utf-8")
          PY
          git add -A
          if git diff --cached --quiet; then
            echo "Production already matches site/ at ${source_sha}"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "deploy: sync site/ from ${source_sha}"
          git push origin HEAD:hostinger-production
