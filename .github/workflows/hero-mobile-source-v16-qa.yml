name: QA Hero mobile V16 source e moldura
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portrait-source:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Chrome H264
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 pngjs@7.0.0
          npx playwright install chrome
      - name: Testes estruturais de Hero e moldura
        run: |
          node --check site/hero-source-mobile-v16.js
          node --check site/moldura-overlay.js
          node tests/hero-mobile-source-v16-smoke.mjs
          node tests/hero-mobile-v10-smoke.mjs
          node tests/floral-mobile-native-v15-smoke.mjs
      - name: Navegador real — desktop → mobile → desktop
        run: |
          node tests/v7-range-server.mjs >/tmp/site-v16.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ -o /dev/null && break || sleep 1; done
          node tests/hero-mobile-source-v16-visual.mjs
          node tests/floral-mobile-native-v15-visual.mjs
