name: Importar HERO retrato para revisão V10
on:
  push:
    branches: [fix/hero-mobile-real-portrait-scroll-v10]
    paths:
      - '.github/workflows/import-hero-mobile-v10.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  asset:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Trazer vídeo mobile derivado do master deste mesmo repositório
        run: |
          curl -fL --retry 3 --max-time 90 'https://raw.githubusercontent.com/GanaLD/to-eventos-preview/fix/hero-responsive-single-video-v73/site/assets/media/motion-hero-mobile.mp4' -o site/assets/media/motion-hero-mobile.mp4
          test "$(wc -c < site/assets/media/motion-hero-mobile.mp4)" -gt 100000
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/assets/media/motion-hero-mobile.mp4')
          assert b'ftyp' in p.read_bytes()[:50]
          print('MP4 vertical recebido:',p.stat().st_size)
          PY
      - name: Commitar asset derivado sem modificar a versão original
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/assets/media/motion-hero-mobile.mp4
          if ! git diff --cached --quiet; then
            git commit -m "assets(hero): incluir animação mobile 9x16"
            git pull --rebase origin fix/hero-mobile-real-portrait-scroll-v10
            git push origin HEAD:fix/hero-mobile-real-portrait-scroll-v10
          fi
